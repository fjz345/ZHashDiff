[package]
name = "ZHashDiff"
version = "1.0.6"
edition = "2024"

[dependencies]
eframe = {version = "0.31.0", features = ["serde", "persistence"]}
env_logger = "0.10"
serde = { version = "1.0.48", features = ["derive"], optional = true}
serde_json = "1.0.48"
egui_tiles =  {version = "0.12.0", features = ["serde"]}
log = "0.4.27"
winapi = "0.3.5"
blake3 = { version = "1.8.2", features = ["rayon", "mmap"] }
rfd = "0.17.1"
egui_extras = { version = "0.31.1" }

[features]
default = ["serde"]
serde = ["dep:serde"]
accesskit = []

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.5", features = ["winnt", "winuser"] }
