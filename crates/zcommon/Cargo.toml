[package]
name = "zcommon"
version = "0.1.0"
edition = "2024"

[lib]
name = "zcommon"

[features]
default = []
gui = ["dep:eframe", "dep:egui_tiles", "dep:egui_extras"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "accesskit",
    "glow",
    "serde",
    "persistence"
] , optional = true }
egui_tiles =  {version = "0.14.1", features = ["serde"], optional = true}
egui_extras = { version = "0.33.3", features = ["image"], optional = true }
blake3 = { version = "1.8.2", features = ["rayon", "mmap"] }
log = "0.4.27"
env_logger = "0.11.9"
tempfile = "3.27.0"
serde = { version = "1.0.48", features = ["derive"], optional = true}
serde_json = { version = "1.0.48", optional = true }