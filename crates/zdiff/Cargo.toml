[package]
name = "zdiff"
version = "0.3.1"
edition = "2024"

[lib]
name = "zdiff"

[features]
default = []
pretty-backtrace = ["dep:color-backtrace"]
serde = ["zcommon/serde", "dep:serde", "dep:serde_json"]

[dependencies]
zcommon = { path = "../zcommon" }
serde = { version = "1.0.48", features = ["derive"], optional = true}
serde_json = { version = "1.0.48", optional = true }
log = "0.4.27"
color-backtrace = { version = "0.7.2", optional = true }
blake3 = { version = "1.8.2", features = ["rayon", "mmap"] }
env_logger = "0.11.9"